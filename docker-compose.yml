services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shorts_tracker
      POSTGRES_USER: shorts
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shorts}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shorts -d shorts_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
